<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo Mágico | Doodle Jump</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.12);
            --accent: #00f2fe;
            --bg-crema: #fdf5e6;
        }

        body { font-family: 'Outfit', sans-serif; background: radial-gradient(circle, #1a1a2e, #16213e); color: white; min-height: 100vh; margin: 0; overflow: hidden; }
        
        .navbar-brand { font-weight: 800; color: var(--accent); text-decoration: none; }
        .btn-action { background: var(--glass); border: 1px solid rgba(255,255,255,0.2); color: white; border-radius: 12px; padding: 8px 16px; transition: 0.3s; }
        .btn-action:hover { background: rgba(255,255,255,0.2); color: var(--accent); }
        
        .game-wrapper {
            width: 320px; height: 480px; margin: 50px auto; border-radius: 16px;
            background: var(--bg-crema); position: relative; overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        #canvas { width: 100%; height: 100%; display: block; }

        .menu-overlay {
            position: absolute; top:0; left:0; width: 100%; height: 100%;
            background: rgba(22, 33, 62, 0.95); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 20;
        }

        .hidden { display: none !important; }

        .btn-play {
            background: var(--accent); color: #1a1a2e; border: none; border-radius: 12px;
            padding: 12px 30px; font-weight: 800; cursor: pointer; transition: 0.3s;
        }
        .btn-play:hover { transform: scale(1.05); box-shadow: 0 0 20px var(--accent); }
        
        #scoreBoard { position: absolute; top: 10px; left: 10px; color: var(--accent); font-weight: 800; z-index: 10; }
        #sprite { display: none; }

        /* Zonas táctiles invisibles */
        .touch-zone { position: absolute; top: 0; bottom: 0; width: 50%; z-index: 15; touch-action: none; }
        #touch-left { left: 0; }
        #touch-right { right: 0; }
    </style>
</head>
<body>

    <header class="navbar pt-4">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand" href="../index.html"><i class="fas fa-magic me-2"></i>MUNDO MÁGICO</a>
            <div class="d-flex gap-2">
                <!-- Botón de Reintentar (aparece al iniciar) -->
                <button id="nav-retry" class="btn-action hidden" onclick="runAction('restart')">
                    <i class="fas fa-redo me-2"></i>Reintentar
                </button>
                <a href="../index.html" class="btn-action"><i class="fas fa-arrow-left me-2"></i>Volver</a>
            </div>
        </div>
    </header>

    <div class="game-wrapper">
        <div id="scoreBoard"><span id="score">0</span></div>
        
        <canvas id="canvas"></canvas>

        <!-- Zonas táctiles invisibles -->
        <div id="touch-left" class="touch-zone"></div>
        <div id="touch-right" class="touch-zone"></div>

        <div id="mainMenu" class="menu-overlay">
            <h2 class="fw-800">Doodle Jump</h2>
            <button class="btn-play mt-3" onclick="runAction('start')">¡JUGAR!</button>
        </div>

        <div id="gameOverMenu" class="menu-overlay hidden">
            <h2 class="text-danger fw-800">¡Caíste!</h2>
            <h4 id="go_score" class="mb-4">Puntos: 0</h4>
            <button class="btn-play" onclick="runAction('restart')">Intentar nuevamente</button>
        </div>
    </div>

    <img id="sprite" src="sprites.png"/>

    <script src="main.js"></script>
    <script src="/js/main.js"></script>
    <script>
        function runAction(action) {
            document.getElementById('mainMenu').classList.add('hidden');
            document.getElementById('gameOverMenu').classList.add('hidden');
            document.getElementById('nav-retry').classList.remove('hidden');
            
            if (action === 'start' && typeof init === 'function') init();
            if (action === 'restart' && typeof reset === 'function') reset();
        }

        // Lógica de control táctil
        const leftZone = document.getElementById('touch-left');
        const rightZone = document.getElementById('touch-right');

        function simulateKey(code, isDown) {
            const event = new KeyboardEvent(isDown ? 'keydown' : 'keyup', { keyCode: code });
            document.dispatchEvent(event);
        }

        leftZone.addEventListener('touchstart', (e) => { e.preventDefault(); simulateKey(37, true); });
        leftZone.addEventListener('touchend', (e) => { e.preventDefault(); simulateKey(37, false); });
        rightZone.addEventListener('touchstart', (e) => { e.preventDefault(); simulateKey(39, true); });
        rightZone.addEventListener('touchend', (e) => { e.preventDefault(); simulateKey(39, false); });
    </script>
</body>
</html>
