<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo Mágico | Tanda de Penales</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">

    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.12);
            --glass-border: rgba(255, 255, 255, 0.2);
            --accent: #00f2fe;
            --accent-2: #4facfe;
            --text-light: #f8f9fa;
            --text-muted: #e0e6ed;
            --success: #28a745;
            --danger: #dc3545;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at top right, #1a1a2e, #16213e);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            margin: 0;
        }

        /* --- Estilos Base de Navegación y Tarjetas --- */
        .navbar-brand {
            font-weight: 800;
            font-size: 1.8rem;
            background: linear-gradient(135deg, #fff 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }

        .btn-back {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            color: var(--text-light);
            border-radius: 12px;
            padding: 8px 16px;
            font-weight: 600;
            transition: 0.3s;
            text-decoration: none;
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.2);
            color: var(--accent);
            border-color: var(--accent);
        }

        .game-section {
            padding: 40px 0 60px;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 35px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .scoreboard {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            font-size: 1.2rem;
            font-weight: 600;
            background: rgba(0, 0, 0, 0.2);
            padding: 12px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* --- Estilos Específicos del Juego de Penales --- */
        .goal-container {
            width: 100%;
            height: 160px;
            background: rgba(255, 255, 255, 0.03);
            /* Patrón que simula la red de la portería */
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 20px 20px;
            border: 4px solid var(--text-muted);
            border-bottom: 4px solid #fff; /* Línea de gol */
            border-radius: 10px 10px 0 0;
            position: relative;
            overflow: hidden;
            margin-bottom: 30px;
            box-shadow: inset 0 10px 30px rgba(0,0,0,0.5);
        }

        .target-zone {
            position: absolute;
            top: 0;
            left: 35%; /* La zona verde empieza en el 35% del ancho */
            width: 30%; /* Ocupa el 30% del centro de la portería */
            height: 100%;
            background: rgba(40, 167, 69, 0.25);
            border-left: 2px dashed var(--success);
            border-right: 2px dashed var(--success);
            box-shadow: 0 0 15px rgba(40, 167, 69, 0.2);
        }

        .ball-container {
            position: absolute;
            bottom: -5px; /* Toca la línea de fondo */
            left: 50%;
            transform: translateX(-50%);
            font-size: 2.5rem;
            color: #fff;
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.5));
            /* Nos permite mover el balón con JS más fluidamente */
            will-change: left;
        }

        /* --- Botones --- */
        .btn-play {
            background: var(--accent);
            color: #1a1a2e;
            border: none;
            border-radius: 12px;
            padding: 12px 20px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
            width: 100%;
        }

        .btn-play:hover {
            background: #fff;
            transform: scale(1.02);
            color: #1a1a2e;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
        }

        footer {
            padding: 20px 0;
            opacity: 0.7;
            text-align: center;
        }
    </style>
</head>
<body>

    <header class="navbar pt-4">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand animate__animated animate__fadeInLeft" href="../index.html">
                <i class="fas fa-magic me-2"></i>MUNDO MÁGICO
            </a>
            <a href="../index.html" class="btn-back animate__animated animate__fadeInRight">
                <i class="fas fa-arrow-left me-2"></i>Volver
            </a>
        </div>
    </header>

    <main class="container game-section flex-grow-1">
        <div class="glass-card animate__animated animate__zoomIn">
            <h1 class="h3 mb-2 fw-600"><i class="fas fa-trophy me-2 text-warning"></i>Tanda de Penales</h1>
            <p class="text-muted small mb-4">Mundial 2026: Detén el balón dentro de la zona verde para anotar.</p>
            
            <div class="scoreboard">
                <div>Goles: <span id="goles" class="text-success fw-bold">0</span></div>
                <div>Fallos: <span id="fallos" class="text-danger fw-bold">0</span></div>
            </div>

            <div class="goal-container">
                <div class="target-zone"></div>
                <div class="ball-container" id="ball">
                    <i class="fas fa-futbol"></i>
                </div>
            </div>

            <button class="btn btn-play" id="shoot-btn" onclick="shoot()">
                <i class="fas fa-shoe-prints me-2"></i> ¡DISPARAR!
            </button>
        </div>
    </main>

    <footer>
        <p class="small m-0">© 2026 Mundo Mágico Studio. Diversión garantizada.</p>
    </footer>

    <script>
        let ball = document.getElementById('ball');
        let btn = document.getElementById('shoot-btn');
        let position = 50; // Inicia en el centro (50%)
        let direction = 1; // 1 va a la derecha, -1 va a la izquierda
        let speed = 1.5;   // Velocidad inicial
        let animationId;
        let isMoving = true; // Control de estado del juego

        // Función que mueve el balón de lado a lado usando RequestAnimationFrame para mayor fluidez
        function moveBall() {
            if (!isMoving) return;
            
            position += speed * direction;
            
            // Rebotar al llegar a los bordes (0% o 90% para evitar que se salga)
            if (position >= 90) {
                position = 90;
                direction = -1;
            } else if (position <= 10) {
                position = 10;
                direction = 1;
            }
            
            ball.style.left = position + '%';
            animationId = requestAnimationFrame(moveBall);
        }

        // Función que se ejecuta al presionar el botón "¡DISPARAR!"
        function shoot() {
            // Si el balón está detenido, reiniciar el movimiento (Siguiente Tiro)
            if (!isMoving) {
                isMoving = true;
                ball.className = "ball-container"; // Resetea animaciones
                ball.style.color = "#fff";
                btn.innerHTML = '<i class="fas fa-shoe-prints me-2"></i> ¡DISPARAR!';
                moveBall();
                return;
            }
            
            // Si el balón se estaba moviendo, detenerlo
            isMoving = false;
            cancelAnimationFrame(animationId);
            
            // Lógica de puntuación
            // La zona verde va del 35% al 65%. Ajustamos el hit-box ligeramente
            if (position >= 35 && position <= 65) {
                // ¡GOL!
                let golesActuales = parseInt(document.getElementById('goles').innerText);
                document.getElementById('goles').innerText = golesActuales + 1;
                
                // Efectos visuales de éxito
                ball.classList.add('animate__animated', 'animate__tada', 'text-success');
                
                // Aumentamos ligeramente la dificultad en cada gol
                if (speed < 4) {
                    speed += 0.3; 
                }
            } else {
                // FALLO
                let fallosActuales = parseInt(document.getElementById('fallos').innerText);
                document.getElementById('fallos').innerText = fallosActuales + 1;
                
                // Efectos visuales de error
                ball.classList.add('animate__animated', 'animate__headShake', 'text-danger');
                
                // Reiniciar velocidad tras un fallo
                speed = 1.5; 
            }
            
            // Cambiar texto del botón para preparar el siguiente tiro
            setTimeout(() => { 
                btn.innerHTML = '<i class="fas fa-redo-alt me-2"></i> Siguiente Tiro'; 
            }, 300);
        }

        // Iniciar la animación tan pronto como cargue la página
        window.onload = function() {
            moveBall();
        };
    </script>
</body>
</html>
