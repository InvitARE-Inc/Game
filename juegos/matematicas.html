<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo Mágico | Desafío Matemático</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">

    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.12);
            --glass-border: rgba(255, 255, 255, 0.2);
            --accent: #00f2fe;
            --accent-2: #4facfe;
            --text-light: #f8f9fa;
            --text-muted: #e0e6ed;
            --success-glow: rgba(40, 167, 69, 0.4);
            --error-glow: rgba(220, 53, 69, 0.4);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at top right, #1a1a2e, #16213e);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            margin: 0;
        }

        .navbar-brand {
            font-weight: 800;
            font-size: 1.8rem;
            background: linear-gradient(135deg, #fff 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }

        .btn-back {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            color: var(--text-light);
            border-radius: 12px;
            padding: 8px 16px;
            font-weight: 600;
            transition: 0.3s;
            text-decoration: none;
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.2);
            color: var(--accent);
            border-color: var(--accent);
        }

        .game-section {
            padding: 40px 0 60px;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 35px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .scoreboard {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            font-size: 1.2rem;
            font-weight: 600;
            background: rgba(0, 0, 0, 0.2);
            padding: 12px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .score-val {
            color: var(--accent);
            font-weight: 800;
        }

        /* --- NUEVOS ESTILOS PARA LA OPERACIÓN VERTICAL --- */
        .operation-box {
            margin: 10px 0 30px;
            display: flex;
            justify-content: center;
        }

        .vertical-math {
            display: inline-block;
            text-align: right;
            font-size: 4rem;
            font-weight: 800;
            /* Usamos monospace para que los números se alineen perfectamente uno sobre otro */
            font-family: 'Courier New', Courier, monospace; 
            color: var(--text-light);
            line-height: 1.1;
        }

        .vertical-math .operand-top {
            padding-right: 10px;
        }

        .vertical-math .operand-bottom {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 20px;
            padding-right: 10px;
        }

        .vertical-math hr {
            border: none;
            height: 6px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            border-radius: 4px;
            margin: 8px 0;
            opacity: 1;
        }

        .vertical-math .question-mark {
            text-align: center;
            color: var(--accent);
            font-family: 'Outfit', sans-serif;
            font-size: 3.5rem;
        }
        /* ------------------------------------------------ */

        .btn-option {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--glass-border);
            color: var(--text-light);
            border-radius: 16px;
            padding: 15px;
            font-size: 1.5rem;
            font-weight: 700;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 100%;
        }

        .btn-option:hover:not(:disabled) {
            transform: scale(1.05);
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
            color: var(--accent);
        }

        .btn-option.correct {
            background: #28a745 !important;
            border-color: #28a745 !important;
            color: #fff !important;
            box-shadow: 0 0 20px var(--success-glow);
        }

        .btn-option.incorrect {
            background: #dc3545 !important;
            border-color: #dc3545 !important;
            color: #fff !important;
            box-shadow: 0 0 20px var(--error-glow);
        }

        footer {
            padding: 20px 0;
            opacity: 0.7;
            text-align: center;
        }
    </style>
</head>
<body>

    <header class="navbar pt-4">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand animate__animated animate__fadeInLeft" href="../index.html">
                <i class="fas fa-magic me-2"></i>MUNDO MÁGICO
            </a>
            <a href="../index.html" class="btn-back animate__animated animate__fadeInRight">
                <i class="fas fa-arrow-left me-2"></i>Volver
            </a>
        </div>
    </header>

    <main class="container game-section">
        <div class="glass-card animate__animated animate__zoomIn">
            <h1 class="h3 mb-4 fw-600"><i class="fas fa-calculator me-2 text-info"></i>Desafío Matemático</h1>
            
            <div class="scoreboard">
                <div>Puntos: <span id="score" class="score-val">0</span></div>
                <div>Racha: <span id="streak" class="score-val">0</span> 🔥</div>
            </div>

            <div id="operation-display" class="operation-box animate__animated">
                </div>

            <div class="row g-3">
                <div class="col-6">
                    <button class="btn-option" onclick="checkAnswer(this)">-</button>
                </div>
                <div class="col-6">
                    <button class="btn-option" onclick="checkAnswer(this)">-</button>
                </div>
                <div class="col-6">
                    <button class="btn-option" onclick="checkAnswer(this)">-</button>
                </div>
                <div class="col-6">
                    <button class="btn-option" onclick="checkAnswer(this)">-</button>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p class="small m-0">© 2026 Mundo Mágico Studio. Diversión garantizada.</p>
    </footer>

    <script>
        let score = 0;
        let streak = 0;
        let correctAnswer = 0;
        let isAnswering = false;

        function generateOperation() {
            isAnswering = false;
            const display = document.getElementById('operation-display');
            display.classList.remove('animate__rubberBand', 'animate__headShake');
            
            const operations = ['+', '-', '*', '/'];
            const op = operations[Math.floor(Math.random() * operations.length)];
            
            let num1, num2;

            if (op === '+') {
                num1 = Math.floor(Math.random() * 49) + 1;
                num2 = Math.floor(Math.random() * 49) + 1;
                correctAnswer = num1 + num2;
            } else if (op === '-') {
                num1 = Math.floor(Math.random() * 50) + 1;
                num2 = Math.floor(Math.random() * num1); 
                correctAnswer = num1 - num2;
            } else if (op === '*') {
                num1 = Math.floor(Math.random() * 10) + 1; 
                num2 = Math.floor(Math.random() * 10) + 1;
                correctAnswer = num1 * num2;
            } else if (op === '/') {
                num2 = Math.floor(Math.random() * 9) + 2; 
                correctAnswer = Math.floor(Math.random() * 10) + 1; 
                num1 = num2 * correctAnswer; 
            }

            let opSymbol = op;
            if (op === '*') opSymbol = '×';
            if (op === '/') opSymbol = '÷';

            // --- INYECCIÓN DEL FORMATO VERTICAL ---
            display.innerHTML = `
                <div class="vertical-math">
                    <div class="operand-top">${num1}</div>
                    <div class="operand-bottom">
                        <span class="text-info">${opSymbol}</span>
                        <span>${num2}</span>
                    </div>
                    <hr>
                    <div class="question-mark">?</div>
                </div>
            `;
            // --------------------------------------

            generateOptions();
        }

        function generateOptions() {
            const buttons = document.querySelectorAll('.btn-option');
            let options = [correctAnswer];

            while (options.length < 4) {
                let offset = (Math.floor(Math.random() * 5) + 1) * (Math.random() < 0.5 ? 1 : -1);
                let fakeAns = correctAnswer + offset;
                if (fakeAns >= 0 && !options.includes(fakeAns)) {
                    options.push(fakeAns);
                }
            }

            options.sort(() => Math.random() - 0.5);

            buttons.forEach((btn, index) => {
                btn.innerText = options[index];
                btn.className = 'btn-option'; 
                btn.disabled = false;
            });
        }

        function checkAnswer(selectedButton) {
            if (isAnswering) return; 
            isAnswering = true;

            const selectedValue = parseInt(selectedButton.innerText);
            const buttons = document.querySelectorAll('.btn-option');
            const display = document.getElementById('operation-display');

            buttons.forEach(btn => btn.disabled = true);

            if (selectedValue === correctAnswer) {
                selectedButton.classList.add('correct');
                display.classList.add('animate__rubberBand');
                score += 10;
                streak += 1;
                document.getElementById('score').innerText = score;
                document.getElementById('streak').innerText = streak;
            } else {
                selectedButton.classList.add('incorrect');
                display.classList.add('animate__headShake');
                streak = 0; 
                document.getElementById('streak').innerText = streak;

                buttons.forEach(btn => {
                    if (parseInt(btn.innerText) === correctAnswer) {
                        btn.classList.add('correct');
                    }
                });
            }

            setTimeout(generateOperation, 1500);
        }

        window.onload = generateOperation;
    </script>
</body>
</html>
